<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghostping 👻</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <section class="entry-screen">

      <div class="ghost">👻</div>

      <p class="system-label">GHOSTPING.EXE</p>

      <div class="terminal">
        <p>INITIALIZING...</p>
        <p>CONNECTION: <span>ESTABLISHED</span></p>
      </div>

      <div class="message-box">
        <p class="sender">UNKNOWN SENDER</p>
        <p class="message">hey, you there?</p>
      </div>

      <button id="openMessage">OPEN MESSAGE</button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
